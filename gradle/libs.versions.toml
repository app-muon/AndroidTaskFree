[versions]
agp = "9.4.0"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
reorderable      = "3.1.0"
coroutines = "1.11.0"
material = "1.14.0"
kotlinx-serialization = "1.12.0"
junit = "4.13.2"
robolectric = "4.17"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
espresso = "3.7.0"
room = "2.8.5"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui         = { group = "androidx.compose.ui",          name = "ui" }          # no version → use BOM
compose-foundation = { group = "androidx.compose.foundation",  name = "foundation" }  # idem
compose-material3  = { group = "androidx.compose.material3",   name = "material3" }   # idem
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" } # version comes from BOM
reorderable        = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.3.0" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.10.2" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.11.0" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version = "4.20.0" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version = "2.7.1" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidx-test" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }      # version from BOM
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" } # version from BOM
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
